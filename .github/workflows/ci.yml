# Every commit: the gate (the build is what is committed, links, twins, origins, the API pin, the tripwire, prose, the
# version), then the app in Chromium against a checkout of the API repository at the ref tests/api.json names and the
# SG/Send API in memory.
name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The gate, exactly as it runs locally
        run: python3 tools/check.py
      - name: The version is above the default branch's
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch --quiet origin main || exit 0
          python3 - <<'PY'
          import json, subprocess, sys
          t = lambda v: tuple(int(x) for x in v[1:].split("."))
          here = json.load(open("tools/version.json"))["version"]
          try:
              base = json.loads(subprocess.check_output(["git", "show", "origin/main:tools/version.json"])).get("version", "v0.0.0")
          except subprocess.CalledProcessError:
              base = "v0.0.0"
          if t(here) <= t(base):
              sys.exit(f"::error::tools/version.json says {here}; main is at {base}: bump the version")
          print(f"{here} is above main's {base}")
          PY
      - id: pin
        name: Which API checkout the test runs against (tests/api.json)
        run: |
          echo "repo=$(python3 -c 'import json;print(json.load(open("tests/api.json"))["repository"])')" >> "$GITHUB_OUTPUT"
          echo "ref=$(python3 -c 'import json;print(json.load(open("tests/api.json"))["ref"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.ref }}
          path: .api
      - name: The app, end to end, in Chromium
        env:
          SEND_API: ${{ github.workspace }}/.api
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/test_app.mjs | tee /tmp/app.log
          if grep -q '^SKIP' /tmp/app.log; then echo "::error::the app test skipped: $(grep -m1 '^SKIP' /tmp/app.log)"; exit 1; fi
